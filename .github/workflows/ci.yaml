name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Typecheck & build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck seluruh workspace
        run: bun run typecheck

      - name: Build apps/web
        run: bun run --filter @writer-hub/web build

  python:
    name: Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Gate yang wajib lulus: seluruh modul harus bisa dikompilasi.
      - name: Compile check
        run: python -m compileall -q .

      # Worker dipindahkan apa adanya dari ai-grammar-checker dan belum pernah
      # diformat ruff. Dua langkah di bawah masih bersifat informatif; jadikan
      # blocking setelah `ruff format .` dijalankan sekali pada seluruh worker.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check .

      - name: Format check (advisory)
        continue-on-error: true
        run: ruff format --check .
