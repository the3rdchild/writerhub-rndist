name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Typecheck & build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck seluruh workspace
        run: bun run typecheck

      - name: Build apps/web
        run: bun run --filter @writer-hub/web build

  python:
    name: Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q .
      - name: Undefined names (blocking)
        run: ruff check --select F821 .

      - name: Tests
        run: pytest -q
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check .

      - name: Format check (advisory)
        continue-on-error: true
        run: ruff format --check .
